          package com.goenglish.app;

          import android.app.Activity;
          import android.content.res.AssetFileDescriptor;
          import android.media.MediaPlayer;
          import android.os.Build;
          import java.util.ArrayList;
          import java.util.HashSet;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.Locale;

          public class MainActivity extends Activity implements TextToSpeech.OnInitListener {
              private WebView web;
              private TextToSpeech tts;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  tts = new TextToSpeech(this, this);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setTextZoom(100);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  web.addJavascriptInterface(new Bridge(), "AndroidTTS");
                  web.addJavascriptInterface(new Audio(), "AndroidAudio");
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onInit(int status) {
                  if (status == TextToSpeech.SUCCESS && tts != null) {
                      tts.setLanguage(Locale.US);
                  }
              }

              public class Bridge {
                  @JavascriptInterface
                  public void speak(String text, float rate) {
                      if (tts == null || text == null) return;
                      float r = Math.max(0.3f, Math.min(2.0f, rate));
                      tts.setLanguage(Locale.US);
                      tts.setSpeechRate(r);
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "u" + System.currentTimeMillis());
                  }

                  @JavascriptInterface
                  public void stop() {
                      if (tts != null) tts.stop();
                  }
              }

              public class Audio {
                  private final HashSet<String> keys = new HashSet<>();
                  private final ArrayList<String> queue = new ArrayList<>();
                  private MediaPlayer mp;
                  private float speed = 1f;

                  Audio() {
                      try {
                          String[] l = getAssets().list("audio");
                          if (l != null) for (String f : l) if (f.endsWith(".mp3")) keys.add(f.substring(0, f.length() - 4));
                      } catch (Exception e) { }
                  }

                  @JavascriptInterface
                  public boolean has(String k) { return k != null && keys.contains(k); }

                  @JavascriptInterface
                  public int count() { return keys.size(); }

                  @JavascriptInterface
                  public int countHuman() {
                      int n = 0;
                      for (String k : keys) if (k.startsWith("h")) n++;
                      return n;
                  }

                  @JavascriptInterface
                  public String credits() {
                      try {
                          java.io.InputStream in = getAssets().open("credits.json");
                          java.io.ByteArrayOutputStream out = new java.io.ByteArrayOutputStream();
                          byte[] buf = new byte[8192];
                          int r;
                          while ((r = in.read(buf)) > 0) out.write(buf, 0, r);
                          in.close();
                          return out.toString("UTF-8");
                      } catch (Exception e) {
                          return "[]";
                      }
                  }

                  @JavascriptInterface
                  public void play(final String k, final float sp) {
                      runOnUiThread(new Runnable() { public void run() {
                          if (tts != null) tts.stop();
                          queue.clear(); speed = sp; start(k);
                      }});
                  }

                  @JavascriptInterface
                  public void playList(final String csv, final float sp) {
                      runOnUiThread(new Runnable() { public void run() {
                          if (tts != null) tts.stop();
                          queue.clear();
                          for (String s : csv.split(",")) if (s.length() > 0) queue.add(s);
                          speed = sp; next();
                      }});
                  }

                  @JavascriptInterface
                  public void stop() {
                      runOnUiThread(new Runnable() { public void run() { queue.clear(); release(); }});
                  }

                  private void next() {
                      if (queue.isEmpty()) { release(); return; }
                      start(queue.remove(0));
                  }

                  private void release() {
                      if (mp != null) {
                          try { mp.stop(); } catch (Exception e) { }
                          mp.release();
                          mp = null;
                      }
                  }

                  private void start(String k) {
                      release();
                      try {
                          AssetFileDescriptor fd = getAssets().openFd("audio/" + k + ".mp3");
                          mp = new MediaPlayer();
                          mp.setDataSource(fd.getFileDescriptor(), fd.getStartOffset(), fd.getLength());
                          fd.close();
                          mp.setOnCompletionListener(new MediaPlayer.OnCompletionListener() {
                              public void onCompletion(MediaPlayer m) { next(); }
                          });
                          mp.prepare();
                          if (Build.VERSION.SDK_INT >= 23 && Math.abs(speed - 1f) > 0.01f) {
                              mp.setPlaybackParams(mp.getPlaybackParams().setSpeed(speed));
                          }
                          mp.start();
                      } catch (Exception e) {
                          next();
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("(window.__back&&window.__back())?'1':'0'", new ValueCallback<String>() {
                      @Override
                      public void onReceiveValue(String v) {
                          if (v == null || !v.contains("1")) finish();
                      }
                  });
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (tts != null) tts.stop();
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          EOF_X
