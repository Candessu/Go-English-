# Go English - construction automatique de l'APK (anglais pas à pas)
# Place ce fichier dans : .github/workflows/go-english-apk.yml
name: Build Go English APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/go-english-apk.yml'

permissions:
  contents: write

